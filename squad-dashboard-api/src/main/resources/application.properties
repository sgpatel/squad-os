server.port=8090
spring.application.name=squad-dashboard-api

# Jackson — serialize Instant as ISO-8601 strings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.io.squados=INFO

# ── SquadOS Redis Integration ────────────────────────────────────────────────
#
# Set squad.redis.enabled=true to read REAL agent data from the same Redis
# that your SquadOS application writes to.
#
# Data read from Redis:
#   squados:traces          LIST   — real AgentSpan records (written by RedisTraceExporter)
#   squados:traces:tokens   STRING — cumulative token count (INCRBY)
#   squados:durable:*       STRING — durable workflow states (written by RedisDurableStore)
#
# When Redis is enabled, the simulation mode is disabled.
# When Redis is unavailable (ping fails), falls back to simulation automatically.
#
# Your SquadOS application.properties must have:
#   squad.tracing.exporter=redis
#   squad.durable.enabled=true
#   squad.durable.store=redis
#
squad.redis.enabled=true
squad.redis.host=localhost
squad.redis.port=6379
squad.redis.password=
