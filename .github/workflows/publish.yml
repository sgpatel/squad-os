name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'          # triggers on v1.2.0, v1.3.0, etc.
  workflow_dispatch:  # allow manual trigger

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run all tests
        run: mvn clean test --no-transfer-progress

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: test     # only publish if all 136 tests pass
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish squad-core to Maven Central
        run: |
          # Only publish squad-core — not the examples
          mvn deploy -P release -pl squad-core -am -DskipTests --no-transfer-progress
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body: |
            ## SquadOS ${{ github.ref_name }}

            Multi-Agent AI Framework for Java.

            ### Maven Central
            ```xml
            <dependency>
              <groupId>io.github.sgpatel</groupId>
              <artifactId>squad-core</artifactId>
              <version>${{ github.ref_name }}</version>
            </dependency>
            ```

            ### What's new
            See [CHANGELOG.md](CHANGELOG.md) for details.
