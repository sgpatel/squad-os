spring.main.web-application-type=none
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.chat.options.stream=false

# squad-spring-boot-starter auto-configuration
squad.name=fraud-detection-squad
squad.llm.provider=ollama
squad.llm.model=llama3.2
squad.tracing.enabled=true
squad.tracing.exporter=memory
squad.security.enabled=true
squad.security.jwt-issuer=squados
squad.approval.enabled=true
