# SquadOS Daily Planner
spring.main.web-application-type=none

# ── Ollama ────────────────────────────────────────────────────────
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.chat.options.stream=false

# ── pgvector memory ───────────────────────────────────────────────
# Set to false to run without PostgreSQL (in-memory mode, memories reset on restart)
# Set to true  to persist memories to PostgreSQL (docker-compose up -d first)
squados.memory.pgvector.enabled=false

# When pgvector disabled, exclude Spring's DataSource auto-config (no DB needed)
# When pgvector enabled, comment out this line so DataSource is auto-configured
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

squados.memory.embedding.dimensions=64
