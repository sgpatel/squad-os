# SquadOS Daily Planner
spring.main.web-application-type=none

# Ollama LLM
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.chat.options.stream=false

# Memory: false=in-memory (no Docker), true=PostgreSQL persistent
squados.memory.pgvector.enabled=false

# Embeddings: false=keyword similarity, true=semantic (needs: ollama pull nomic-embed-text)
squados.memory.real-embeddings=false
squados.memory.embedding.dimensions=64

# No DB when pgvector disabled
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration