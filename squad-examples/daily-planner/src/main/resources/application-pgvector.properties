# SquadOS Daily Planner — pgvector persistent memory profile
# Activate with: mvn spring-boot:run -Dspring.profiles.active=pgvector
# Requires: docker-compose up -d

squados.memory.pgvector.enabled=true

# Remove the DataSource exclusion (we need it now)
spring.autoconfigure.exclude=

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/squados
spring.datasource.username=squados
spring.datasource.password=squados
spring.datasource.driver-class-name=org.postgresql.Driver
