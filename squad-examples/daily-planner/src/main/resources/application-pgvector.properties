# Full production profile
# Run: mvn spring-boot:run -Dspring.profiles.active=pgvector
# Requires: docker-compose up -d  +  ollama pull nomic-embed-text

squados.memory.pgvector.enabled=true
squados.memory.real-embeddings=true
spring.autoconfigure.exclude=

spring.datasource.url=jdbc:postgresql://localhost:5432/squados
spring.datasource.username=squados
spring.datasource.password=squados
spring.datasource.driver-class-name=org.postgresql.Driver

spring.ai.ollama.embedding.options.model=nomic-embed-text