# SquadOS Daily Planner — full production profile
# Activate: mvn spring-boot:run -Dspring.profiles.active=pgvector
# Requires:
#   docker-compose up -d
#   ollama pull nomic-embed-text

# Memory mode
squados.memory.pgvector.enabled=true
squados.memory.real-embeddings=true
spring.autoconfigure.exclude=

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/squados
spring.datasource.username=squados
spring.datasource.password=squados
spring.datasource.driver-class-name=org.postgresql.Driver

# Ollama embedding — nomic-embed-text produces 768-dim vectors
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.ollama.embedding.enabled=true

# Dimensions for pgvector HNSW index
# IMPORTANT: if you already have a DB from mock embeddings (64 dims),
# drop and recreate: DROP TABLE squad_memories; then restart.
squados.memory.embedding.dimensions=768
