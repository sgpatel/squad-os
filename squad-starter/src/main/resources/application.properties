# SquadOS is a CLI application — disable web server entirely
spring.main.web-application-type=none

# Ollama configuration
# Requires: ollama serve (running on localhost:11434)
# Pull models first:
#   ollama pull llama3.2
#   ollama pull nomic-embed-text

spring.ai.ollama.base-url=http://localhost:11434

# Chat model
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.7

# Embedding model (for SquadOS memory layer)
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Disable streaming
spring.ai.ollama.chat.options.stream=false

# Auto-pull models on startup if not already present
spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.init.timeout=120s
