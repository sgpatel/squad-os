# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# Upload size caps. Two limits stack here:
#   - spring.servlet.multipart.*  — Spring's multipart resolver. Defaults
#     are 1 MB file + 10 MB request, far too small for a 100 MB textbook.
#   - server.tomcat.max-http-form-post-size — the connector limit. Spring's
#     multipart resolver runs INSIDE the connector, so this must be at
#     least as large as the multipart limits or you get a 400/413 before
#     the multipart code even runs.
# Set to 128 MB so a typical college reference fits with headroom.
# The downstream BookExtractionService enforces its own 128 MiB cap so a
# misconfigured client can't push 1 GB through the LLM path.
spring.servlet.multipart.max-file-size=128MB
spring.servlet.multipart.max-request-size=128MB
server.tomcat.max-http-form-post-size=128MB
# Long uploads over slow connections must not time out mid-stream.
server.tomcat.connection-timeout=600s

# ── SquadOS Core ─────────────────────────────────────────────────────────────
squad.llm.provider=openai
squad.llm.model=gpt-4o-mini
squad.llm.temperature=0.4
squad.llm.max-tokens=2048

# ── Feature flags ────────────────────────────────────────────────────────────
squad.memory.enabled=true
squad.memory.store=in-process
squad.memory.top-k=5

# Episodic memory backend — in-process (default, ephemeral) or pgvector
# (persistent, requires Postgres + pgvector extension + a DataSource bean).
# Falls back to in-process if pgvector is requested but no DataSource exists,
# so dev never breaks because Postgres isn't running locally.
squad.memory.episodic-store=in-process

# Embedding dimensions used by PgVectorEpisodicStore for the vector(N)
# column. Must match the embedder: text-embedding-3-small=1536,
# text-embedding-3-large=3072, nomic-embed-text=768.
squad.memory.embedding-dimensions=1536

squad.guardrails.enabled=true

# ── Actuator (compose healthcheck target) ────────────────────────────
# /actuator/health is the only endpoint exposed; other actuator surfaces
# stay off so we don't accidentally publish heap dumps or env vars.
# Detail level NEVER exposes downstream component breakdowns publicly —
# the healthcheck only needs UP/DOWN.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

squad.durable.enabled=true
squad.durable.store=memory
squad.durable.ttl-hours=72

squad.tracing.enabled=true
squad.tracing.exporter=log

# OTel export (set to 'otlp' for Jaeger in production)
squad.otel.enabled=false
squad.otel.endpoint=http://localhost:4318/v1/traces
squad.otel.service-name=tutor-os

# Benchmark evaluation (set to true to run on startup)
squad.benchmark.enabled=false

# Prompt optimisation (set to true to run nightly)
squad.optimize.enabled=false

# Debate engine
squad.debate.enabled=true

# MCP server — exposes TutorOS agents as MCP tools (e.g. for Slack bot or IDE)
squad.mcp.server.enabled=false
squad.mcp.server.port=3100

# ── Mastery graph backend (M3-JDBC) ──────────────────────────────────────────
# in-process (default, ephemeral) or jdbc (persistent, requires
# spring.datasource.* config + a JDBC driver). Falls back to in-process
# if jdbc is requested but no DataSource is on the context.
tutor.mastery.store=in-process

# ── Book repository backend (PR-1 BookCoach) ────────────────────────────────
# Mirrors tutor.mastery.store — same in-process / jdbc options, same
# fallback if jdbc is requested without a DataSource. JdbcBookStore
# bootstraps the tutor_books + tutor_chapters tables on first use.
tutor.book.store=in-process

# ── TutorOS application properties ───────────────────────────────────────────

# School LMS integration (leave blank to use built-in syllabus)
tutor.lms.url=

# Teacher portal for escalation notifications
tutor.teacher-portal.url=

# Manim render service (Python container)
tutor.manim.url=

# ── Spring AI / OpenAI ───────────────────────────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.4
spring.ai.openai.chat.options.max-tokens=2048
spring.ai.openai.embedding.options.model=text-embedding-3-small

# ── Auto-config excludes (default / cloud / dev) ────────────────────────────
# Two things to disable when running outside docker-compose:
#
#   1. OllamaAutoConfiguration — Spring AI 1.0.0-M5 wires both OpenAI and
#      Ollama beans on classpath presence (no gating on api-key / base-url
#      being non-empty). Both starters ship on classpath because the compose
#      stack needs Ollama at runtime, so we explicitly drop the unused
#      provider's auto-config here. Selfhost profile flips this — see
#      application-selfhost.properties.
#
#   2. DataSourceAutoConfiguration — spring-boot-starter-jdbc is on
#      classpath for M3-JDBC mastery + PR-1 book persistence in selfhost
#      mode. Without an explicit exclude, Spring Boot tries to spin up a
#      HikariDataSource at boot even with no spring.datasource.url set, and
#      fails because no embedded DB is present. Excluding it in default mode
#      means our in-process MasteryGraphStore + InProcessBookStore beans are
#      the only persistence layer wired, and dev boot is back to green.
#      Selfhost profile sets spring.datasource.url so the auto-config has
#      what it needs and stays active.
spring.autoconfigure.exclude=\
  org.springframework.ai.autoconfigure.ollama.OllamaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.io.squados=INFO
logging.level.io.squados.examples.tutoros=DEBUG
