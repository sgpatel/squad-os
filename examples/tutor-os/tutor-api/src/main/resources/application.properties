# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ── SquadOS Core ─────────────────────────────────────────────────────────────
squad.llm.model=llama3.2
squad.llm.temperature=0.4
squad.llm.max-tokens=2048

# ── Feature flags ────────────────────────────────────────────────────────────
squad.memory.enabled=true
squad.memory.store=in-process
squad.memory.top-k=5

squad.guardrails.enabled=true

squad.durable.enabled=true
squad.durable.store=memory
squad.durable.ttl-hours=72

squad.tracing.enabled=true
squad.tracing.exporter=log

# OTel export (set to 'otlp' for Jaeger in production)
squad.otel.enabled=false
squad.otel.endpoint=http://localhost:4318/v1/traces
squad.otel.service-name=tutor-os

# Benchmark evaluation (set to true to run on startup)
squad.benchmark.enabled=false

# Prompt optimisation (set to true to run nightly)
squad.optimize.enabled=false

# Debate engine
squad.debate.enabled=true

# MCP server — exposes TutorOS agents as MCP tools (e.g. for Slack bot or IDE)
squad.mcp.server.enabled=false
squad.mcp.server.port=3100

# ── TutorOS application properties ───────────────────────────────────────────

# School LMS integration (leave blank to use built-in syllabus)
tutor.lms.url=

# Teacher portal for escalation notifications
tutor.teacher-portal.url=

# Manim render service (Python container)
tutor.manim.url=

# ── Spring AI / Ollama ────────────────────────────────────────────────────────
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2
spring.ai.ollama.embedding.model=nomic-embed-text

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.io.squados=INFO
logging.level.io.squados.examples.tutoros=DEBUG
