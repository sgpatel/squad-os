# ── Self-hosted profile (docker compose / OpenClaude-for-learners) ──────────
#
# Activated when SPRING_PROFILES_ACTIVE=selfhost (the docker-compose stack
# sets this in the tutor-api service env). Switches:
#
#   - LLM provider  : OpenAI    → Ollama (local)
#   - Embedder      : OpenAI    → Ollama (local, nomic-embed-text)
#   - Memory        : in-process → pgvector (persistent)
#   - Mastery graph : in-process → JDBC Postgres (persistent)
#
# Everything is overrideable per-env via standard Spring property
# precedence — set OPENAI_API_KEY in the environment to bring OpenAI
# back online without changing this file.

# ── LLM (Ollama) ──────────────────────────────────────────────────────
# Compose service name; override to a remote host with OLLAMA_BASE_URL.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://ollama:11434}

# llama3.2:3b is the smallest model that produces stable structured
# JSON output for our @StructuredOutput agents. Larger models
# (qwen2.5:7b, llama3.1:8b) work better but pull longer; bump via env.
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2:3b}
spring.ai.ollama.chat.options.temperature=0.4

# nomic-embed-text is 768-dim — match the M1 pgvector schema below.
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBED_MODEL:nomic-embed-text}

# Disable the OpenAI auto-config in selfhost mode by clearing the
# api-key — Spring AI gates OpenAI bean creation on this property
# being non-blank, so leaving it empty prevents conflicting
# ChatModel / EmbeddingModel beans.
spring.ai.openai.api-key=

# Override the SquadOS LLM runtime config to match.
squad.llm.provider=ollama
squad.llm.model=${OLLAMA_CHAT_MODEL:llama3.2:3b}

# ── Memory backend (M1) ───────────────────────────────────────────────
# Flip episodic memory to pgvector. Embedding dimensions must match the
# embedder — nomic-embed-text → 768, swap if you change models.
squad.memory.episodic-store=pgvector
squad.memory.embedding-dimensions=${EMBED_DIMS:768}

# ── Mastery graph backend (M3-JDBC) ───────────────────────────────────
tutor.mastery.store=jdbc

# ── Spring datasource (Postgres + pgvector) ───────────────────────────
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://postgres:5432/tutoros}
spring.datasource.username=${POSTGRES_USER:tutoros}
spring.datasource.password=${POSTGRES_PASSWORD:tutoros}
spring.datasource.driver-class-name=org.postgresql.Driver
# Single shared pool — both pgvector store and JDBC mastery store reuse it.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ── Logging in selfhost mode ─────────────────────────────────────────
# Crank the squad logger up to DEBUG so model-pull / first-run
# embedder failures surface clearly during the inevitable initial
# debugging session. Drop back to INFO once the stack settles.
logging.level.io.squados=INFO
logging.level.io.tutoros=DEBUG
logging.level.org.springframework.ai=INFO
