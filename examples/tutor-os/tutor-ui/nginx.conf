# nginx config for the tutor-ui container.
#
#   - Serves the Vite build output on /
#   - SPA fallback: any route not matching a static asset → /index.html
#     so React Router handles deep-links (/review, /tutor/abc, /notes)
#   - Proxies the backend routes to the tutor-api service on the
#     compose network. Browser sees same-origin URLs (/api/...,
#     /session/..., etc.) — no CORS headache.
#   - Upgrades the /ws WebSocket so the live tutor stream works.

upstream tutor_api {
    server tutor-api:8080;
}

server {
    listen 80 default_server;
    server_name _;

    # Static SPA assets.
    root /usr/share/nginx/html;
    index index.html;

    # Compose healthcheck target.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Backend routes ───────────────────────────────────────────────
    # M3 review queue, M1+M3 mastery, syllabus, progress — anything
    # mounted under one of these prefixes is server territory.
    location ~ ^/(api|session|quiz|progress|plan|admin)/ {
        proxy_pass         http://tutor_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # File uploads:
        #   - PR-D /api/syllabus/extract — usually a few MB
        #   - PR-1 /api/books/upload     — full textbooks (Probabilistic
        #                                  Machine Learning is ~98 MB).
        # Cap at 128 MB so a typical college-level reference fits with
        # headroom; bumping further requires matching changes in Tomcat
        # (server.tomcat.max-http-form-post-size) and Spring multipart
        # (spring.servlet.multipart.max-*) — see application.properties.
        client_max_body_size 128m;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
    }

    # ── WebSocket (live tutor stream) ────────────────────────────────
    location /ws {
        proxy_pass         http://tutor_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── SPA fallback ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
